name: Sync Docker Images to Aliyun

on:
  workflow_dispatch:  # 手动触发
  # 如果你想定时自动同步，去掉下面注释
  # schedule:
  #   - cron: '0 0 * * 0'  # 每周日零点

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Pull and Push Open WebUI
        run: |
          echo "Pulling Open WebUI from ghcr.io..."
          docker pull ghcr.io/open-webui/open-webui:main
          echo "Tagging for Aliyun..."
          docker tag ghcr.io/open-webui/open-webui:main \
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/open-webui:main
          echo "Pushing to Aliyun..."
          docker push ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/open-webui:main
          echo "✅ Open WebUI sync complete!"

      - name: Pull and Push n8n
        run: |
          echo "Pulling n8n from Docker Hub..."
          docker pull n8nio/n8n:latest
          echo "Tagging for Aliyun..."
          docker tag n8nio/n8n:latest \
            ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/n8n:latest
          echo "Pushing to Aliyun..."
          docker push ${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_NAMESPACE }}/n8n:latest
          echo "✅ n8n sync complete!"

      - name: Cleanup
        run: |
          docker system prune -af
          echo "🗑️ Cleanup complete!"
